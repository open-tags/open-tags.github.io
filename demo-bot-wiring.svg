<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" font-family="Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="1200" height="840" fill="#ffffff"/>
  <text x="600" y="34" font-size="22" font-weight="bold" text-anchor="middle">Demo Bot — Simplest Wiring (open-loop + UWB)</text>
  <text x="600" y="54" font-size="13" fill="#666" text-anchor="middle">Jetson Orin Nano  •  2x opentag (serial)  •  ESP32 + BNO085  •  2x TB6612FNG  •  4x JGA25-370</text>

  <!-- ===== POWER SOURCE ROW ===== -->
  <rect x="40" y="70" width="170" height="64" rx="6" fill="#fde" stroke="#c33" stroke-width="2"/>
  <text x="125" y="96" font-size="14" font-weight="bold" text-anchor="middle">3S LiPo</text>
  <text x="125" y="114" font-size="11" text-anchor="middle">11.1V nom / 12.6V max</text>
  <text x="125" y="128" font-size="11" text-anchor="middle">XT60</text>

  <rect x="244" y="80" width="78" height="44" rx="6" fill="#fff" stroke="#c33" stroke-width="2"/>
  <text x="283" y="107" font-size="12" text-anchor="middle">Main SW</text>

  <rect x="352" y="80" width="78" height="44" rx="6" fill="#fff" stroke="#c33" stroke-width="2"/>
  <text x="391" y="100" font-size="12" text-anchor="middle">Fuse</text>
  <text x="391" y="115" font-size="11" text-anchor="middle">10A</text>

  <!-- power chain wires -->
  <line x1="210" y1="102" x2="244" y2="102" stroke="#c33" stroke-width="3"/>
  <line x1="322" y1="102" x2="352" y2="102" stroke="#c33" stroke-width="3"/>
  <line x1="391" y1="124" x2="391" y2="150" stroke="#c33" stroke-width="3"/>

  <!-- VBAT BUS -->
  <line x1="150" y1="150" x2="1150" y2="150" stroke="#c33" stroke-width="4"/>
  <text x="900" y="143" font-size="13" font-weight="bold" fill="#c33" text-anchor="middle">+VBAT  (~12V rail)</text>

  <!-- ===== JETSON ===== -->
  <rect x="40" y="210" width="300" height="150" rx="8" fill="#eef" stroke="#33c" stroke-width="2"/>
  <text x="190" y="236" font-size="15" font-weight="bold" text-anchor="middle">Jetson Orin Nano (Python)</text>
  <text x="190" y="258" font-size="11" text-anchor="middle">DC-IN barrel: 7-20V  (VBAT direct)</text>
  <text x="190" y="276" font-size="11" text-anchor="middle">USB #1 -> opentag   USB #2 -> ESP32</text>
  <text x="190" y="296" font-size="11" text-anchor="middle">reads pose, runs P-controller</text>
  <text x="190" y="316" font-size="11" text-anchor="middle">sends "v vx vy w" @ ~50 Hz</text>
  <text x="190" y="340" font-size="10" fill="#666" text-anchor="middle">udev: /dev/opentag, /dev/esp32 (no swap)</text>

  <!-- VBAT tap to Jetson DC-IN -->
  <line x1="190" y1="150" x2="190" y2="210" stroke="#c33" stroke-width="3"/>
  <text x="205" y="178" font-size="11" fill="#c33">12V</text>

  <!-- ===== OPENTAGS ===== -->
  <rect x="420" y="206" width="255" height="62" rx="8" fill="#efe" stroke="#2a7" stroke-width="2"/>
  <text x="547" y="228" font-size="13" font-weight="bold" text-anchor="middle">opentag #1 (on bot)</text>
  <text x="547" y="246" font-size="11" text-anchor="middle">USB-C -> /dev/opentag</text>
  <text x="547" y="261" font-size="10" fill="#666" text-anchor="middle">powered + serial over Jetson USB</text>

  <rect x="420" y="280" width="255" height="56" rx="8" fill="#efe" stroke="#2a7" stroke-width="2"/>
  <text x="547" y="302" font-size="13" font-weight="bold" text-anchor="middle">opentag #2 (target / anchor)</text>
  <text x="547" y="320" font-size="10" fill="#666" text-anchor="middle">the point the bot drives toward (TWR)</text>

  <!-- USB Jetson -> opentag1 -->
  <line x1="340" y1="240" x2="420" y2="237" stroke="#93c" stroke-width="2.5"/>
  <text x="360" y="230" font-size="10" fill="#93c">USB-C</text>

  <!-- ===== ESP32 ===== -->
  <rect x="40" y="430" width="300" height="200" rx="8" fill="#eef" stroke="#33c" stroke-width="2"/>
  <text x="190" y="456" font-size="15" font-weight="bold" text-anchor="middle">ESP32 (classic WROOM-32)</text>
  <text x="190" y="478" font-size="11" text-anchor="middle">powered + serial via USB from Jetson</text>
  <text x="190" y="496" font-size="11" text-anchor="middle">mecanum IK -> 4x PWM</text>
  <text x="190" y="514" font-size="11" text-anchor="middle">reads BNO085 yaw, replies "y yaw"</text>
  <line x1="60" y1="528" x2="320" y2="528" stroke="#99c" stroke-width="1"/>
  <text x="190" y="546" font-size="10" text-anchor="middle">3V3 out -> driver VCC/STBY + IMU</text>
  <text x="190" y="562" font-size="10" text-anchor="middle">I2C: SDA=GPIO16  SCL=GPIO17</text>
  <text x="190" y="580" font-size="10" text-anchor="middle">M1 25/26/27  M2 33/32/13</text>
  <text x="190" y="596" font-size="10" text-anchor="middle">M3 5/18/19   M4 23/21/22  (PWM/IN1/IN2)</text>
  <text x="190" y="616" font-size="10" fill="#666" text-anchor="middle">control loop pinned to core 1, WiFi off</text>

  <!-- USB Jetson -> ESP32 (power + serial) -->
  <line x1="110" y1="360" x2="110" y2="430" stroke="#93c" stroke-width="2.5"/>
  <text x="116" y="400" font-size="10" fill="#93c">USB (serial + 5V)</text>

  <!-- ===== IMU ===== -->
  <rect x="420" y="450" width="210" height="86" rx="8" fill="#ffe" stroke="#b90" stroke-width="2"/>
  <text x="525" y="474" font-size="13" font-weight="bold" text-anchor="middle">BNO085 IMU</text>
  <text x="525" y="492" font-size="10" text-anchor="middle">VIN&lt;-3V3  GND  SDA  SCL</text>
  <text x="525" y="508" font-size="10" text-anchor="middle">absolute yaw (onboard fusion)</text>
  <text x="525" y="526" font-size="10" fill="#666" text-anchor="middle">mount at center, away from motors</text>

  <!-- I2C + 3V3 ESP32 -> IMU -->
  <line x1="340" y1="478" x2="420" y2="478" stroke="#d59" stroke-width="2.5"/>
  <text x="345" y="471" font-size="10" fill="#d59">I2C</text>
  <line x1="340" y1="500" x2="420" y2="500" stroke="#2a7" stroke-width="2.5"/>
  <text x="345" y="516" font-size="10" fill="#2a7">3V3</text>

  <!-- ===== TB6612 DRIVERS ===== -->
  <rect x="720" y="220" width="200" height="150" rx="8" fill="#fef" stroke="#92c" stroke-width="2"/>
  <text x="820" y="244" font-size="14" font-weight="bold" text-anchor="middle">TB6612FNG #1</text>
  <text x="820" y="264" font-size="10" text-anchor="middle">VM &lt;- VBAT (max 13.5V)</text>
  <text x="820" y="280" font-size="10" text-anchor="middle">VCC &lt;- 3V3   STBY &lt;- 3V3</text>
  <text x="820" y="300" font-size="11" text-anchor="middle">A -> M1   B -> M2</text>
  <text x="820" y="322" font-size="10" fill="#666" text-anchor="middle">1.2A cont / 3.2A peak per ch</text>

  <rect x="720" y="440" width="200" height="150" rx="8" fill="#fef" stroke="#92c" stroke-width="2"/>
  <text x="820" y="464" font-size="14" font-weight="bold" text-anchor="middle">TB6612FNG #2</text>
  <text x="820" y="484" font-size="10" text-anchor="middle">VM &lt;- VBAT (max 13.5V)</text>
  <text x="820" y="500" font-size="10" text-anchor="middle">VCC &lt;- 3V3   STBY &lt;- 3V3</text>
  <text x="820" y="520" font-size="11" text-anchor="middle">A -> M3   B -> M4</text>
  <text x="820" y="542" font-size="10" fill="#666" text-anchor="middle">1.2A cont / 3.2A peak per ch</text>

  <!-- VBAT to drivers VM -->
  <line x1="690" y1="150" x2="690" y2="515" stroke="#c33" stroke-width="3"/>
  <line x1="690" y1="270" x2="720" y2="270" stroke="#c33" stroke-width="3"/>
  <line x1="690" y1="490" x2="720" y2="490" stroke="#c33" stroke-width="3"/>
  <text x="640" y="320" font-size="11" fill="#c33">VM 12V</text>

  <!-- 3V3 ESP32 -> drivers VCC/STBY -->
  <line x1="340" y1="546" x2="660" y2="546" stroke="#2a7" stroke-width="2.5"/>
  <line x1="660" y1="546" x2="660" y2="345" stroke="#2a7" stroke-width="2.5"/>
  <line x1="660" y1="345" x2="720" y2="345" stroke="#2a7" stroke-width="2.5"/>
  <line x1="660" y1="565" x2="720" y2="565" stroke="#2a7" stroke-width="2.5"/>
  <text x="500" y="540" font-size="10" fill="#2a7">3V3 -> VCC + STBY</text>

  <!-- control signals ESP32 -> drivers -->
  <line x1="340" y1="450" x2="560" y2="450" stroke="#06c" stroke-width="2.5"/>
  <line x1="560" y1="450" x2="560" y2="252" stroke="#06c" stroke-width="2.5"/>
  <line x1="560" y1="252" x2="720" y2="252" stroke="#06c" stroke-width="2.5"/>
  <text x="575" y="245" font-size="10" fill="#06c">PWM/IN1/IN2 x2 (M1,M2)</text>

  <line x1="340" y1="608" x2="600" y2="608" stroke="#06c" stroke-width="2.5"/>
  <line x1="600" y1="608" x2="600" y2="472" stroke="#06c" stroke-width="2.5"/>
  <line x1="600" y1="472" x2="720" y2="472" stroke="#06c" stroke-width="2.5"/>
  <text x="610" y="466" font-size="10" fill="#06c">PWM/IN1/IN2 x2 (M3,M4)</text>

  <!-- ===== MOTORS ===== -->
  <rect x="980" y="222" width="150" height="56" rx="8" fill="#fff" stroke="#555" stroke-width="2"/>
  <text x="1055" y="246" font-size="12" font-weight="bold" text-anchor="middle">M1 (FL)</text>
  <text x="1055" y="263" font-size="10" text-anchor="middle">JGA25-370</text>
  <rect x="980" y="300" width="150" height="56" rx="8" fill="#fff" stroke="#555" stroke-width="2"/>
  <text x="1055" y="324" font-size="12" font-weight="bold" text-anchor="middle">M2 (FR)</text>
  <text x="1055" y="341" font-size="10" text-anchor="middle">JGA25-370</text>
  <rect x="980" y="442" width="150" height="56" rx="8" fill="#fff" stroke="#555" stroke-width="2"/>
  <text x="1055" y="466" font-size="12" font-weight="bold" text-anchor="middle">M3 (RL)</text>
  <text x="1055" y="483" font-size="10" text-anchor="middle">JGA25-370</text>
  <rect x="980" y="520" width="150" height="56" rx="8" fill="#fff" stroke="#555" stroke-width="2"/>
  <text x="1055" y="544" font-size="12" font-weight="bold" text-anchor="middle">M4 (RR)</text>
  <text x="1055" y="561" font-size="10" text-anchor="middle">JGA25-370</text>

  <!-- driver -> motor (2-wire) -->
  <line x1="920" y1="260" x2="980" y2="250" stroke="#f80" stroke-width="3"/>
  <line x1="920" y1="300" x2="980" y2="328" stroke="#f80" stroke-width="3"/>
  <line x1="920" y1="480" x2="980" y2="470" stroke="#f80" stroke-width="3"/>
  <line x1="920" y1="520" x2="980" y2="548" stroke="#f80" stroke-width="3"/>
  <text x="930" y="245" font-size="9" fill="#f80">AO1/AO2</text>

  <!-- ===== GND BUS ===== -->
  <line x1="150" y1="700" x2="1150" y2="700" stroke="#222" stroke-width="4"/>
  <text x="650" y="720" font-size="13" font-weight="bold" text-anchor="middle">GND  (single common star ground: battery -, Jetson, ESP32, both drivers)</text>
  <line x1="160" y1="134" x2="160" y2="700" stroke="#222" stroke-width="2"/>
  <line x1="70"  y1="360" x2="70"  y2="700" stroke="#222" stroke-width="2"/>
  <line x1="70"  y1="630" x2="70"  y2="700" stroke="#222" stroke-width="2"/>
  <line x1="760" y1="370" x2="760" y2="700" stroke="#222" stroke-width="2"/>
  <line x1="760" y1="590" x2="760" y2="700" stroke="#222" stroke-width="2"/>

  <!-- ===== LEGEND ===== -->
  <rect x="40" y="740" width="1110" height="78" rx="8" fill="#fafafa" stroke="#ccc"/>
  <text x="55" y="760" font-size="12" font-weight="bold">Legend</text>
  <line x1="120" y1="756" x2="160" y2="756" stroke="#c33" stroke-width="4"/><text x="166" y="760" font-size="11">VBAT ~12V</text>
  <line x1="260" y1="756" x2="300" y2="756" stroke="#2a7" stroke-width="3"/><text x="306" y="760" font-size="11">3V3</text>
  <line x1="360" y1="756" x2="400" y2="756" stroke="#222" stroke-width="3"/><text x="406" y="760" font-size="11">GND</text>
  <line x1="470" y1="756" x2="510" y2="756" stroke="#93c" stroke-width="3"/><text x="516" y="760" font-size="11">USB serial</text>
  <line x1="610" y1="756" x2="650" y2="756" stroke="#06c" stroke-width="3"/><text x="656" y="760" font-size="11">motor control (PWM/IN)</text>
  <line x1="830" y1="756" x2="870" y2="756" stroke="#f80" stroke-width="3"/><text x="876" y="760" font-size="11">motor power out</text>
  <line x1="1000" y1="756" x2="1040" y2="756" stroke="#d59" stroke-width="3"/><text x="1046" y="760" font-size="11">I2C</text>
  <text x="55" y="790" font-size="11" fill="#444">No buck needed for v1: ESP32 powered from Jetson USB; driver VCC/STBY + IMU from ESP32 3V3; only VBAT and GND are shared high-current rails.</text>
  <text x="55" y="808" font-size="11" fill="#444">Optional upgrade (closed loop): wire each encoder A/B into ESP32 PCNT inputs (e.g. 34/35/36/39 + 2 more) and power encoders from 3V3 — note this pushes a 38-pin board to its GPIO limit.</text>
</svg>
