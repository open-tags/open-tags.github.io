name: Check public brand and legacy links
on:
  pull_request:
permissions:
  contents: read
jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/sync_brand.py --check
      - run: python3 -B -m unittest discover -s tests -p 'test_brand.py' -v
